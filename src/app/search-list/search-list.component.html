<ngx-spinner class="custom_loader">
  <img src="../../../assets/Loader.gif" />
</ngx-spinner>

<div class="container-fluid" style="padding: 30px 65px">
  <div class="row justify-content-center">
    <!-- Sidebar / Filters -->
    <div
      class="col-md-2 pe-3"
      style="
        background-color: white;
        border-radius: 8px;
        border: 1px solid rgba(133, 132, 132, 0.2);
        padding: 10px;
      "
    >
      <!-- Price Filter -->
      <h4 class="mb-3 text-muted">Price</h4>

      <div class="row mt-2">
        <div class="col-6">
          <p class="mb-1 small fw-medium">Min</p>
          <input
            type="text"
            class="form-control form-control-sm"
            (change)="price_min(minValue, maxValue)"
            [(ngModel)]="minValue"
            style="padding: 4px !important"
          />
        </div>
        <div class="col-6">
          <p class="mb-1 small fw-medium">Max</p>
          <input
            type="text"
            class="form-control form-control-sm"
            (change)="price_min(minValue, maxValue)"
            [(ngModel)]="maxValue"
            style="padding: 4px !important"
          />
        </div>
      </div>
      <!-- Sort By Section (aligned like Discount) -->
      <h4 class="mt-4 mb-3 text-muted">Sort By</h4>
      <ul class="list-unstyled">
        <li class="form-check mb-2">
          <input
            type="checkbox"
            class="form-check-input"
            [checked]="selected_sort === 'asc'"
            (change)="setSort('asc')"
            style="border: 2px solid rgb(102, 96, 96)"
          />
          <label
            class="form-check-label ms-2"
            style="color: rgb(102, 96, 96); cursor: pointer"
          >
            Price Low to High
          </label>
        </li>
        <li class="form-check mb-2">
          <input
            type="checkbox"
            class="form-check-input"
            [checked]="selected_sort === 'desc'"
            (change)="setSort('desc')"
            style="border: 2px solid rgb(102, 96, 96)"
          />
          <label
            class="form-check-label ms-2"
            style="color: rgb(102, 96, 96); cursor: pointer"
          >
            Price High to Low
          </label>
        </li>
        <li class="form-check mb-2">
          <input
            type="checkbox"
            class="form-check-input"
            [checked]="selected_sort === 'popularity'"
            (change)="setSort('popularity')"
            style="border: 2px solid rgb(102, 96, 96)"
          />
          <label
            class="form-check-label ms-2"
            style="color: rgb(102, 96, 96); cursor: pointer"
          >
            Popularity
          </label>
        </li>
      </ul>
      <!-- Image below all filters -->
      <div class="text-center mt-4">
        <img
          src="assets/images/image.png"
          alt="Promotional Filter Banner"
          class="img-fluid rounded shadow-sm"
          style="height: 200px; width: 250px"
        />
      </div>
      <!-- Discount Filter -->
      <h4 class="mt-4 mb-3 text-muted">Discount</h4>
      <ul class="list-unstyled">
        <li *ngFor="let d of [10, 20, 30, 40, 50]" class="form-check mb-2">
          <input
            type="checkbox"
            class="form-check-input"
            [checked]="selected_disc === d"
            (change)="disc(d)"
            style="border: 2px solid rgb(102, 96, 96)"
          />
          <label class="form-check-label ms-2" style="color: rgb(102, 96, 96)">
            {{ d }}% or More
          </label>
        </li>
      </ul>
    </div>

<!-- Product List Section -->
<div class="col-md-10">
  <div class="row">
    <div
    class="col-12 col-sm-12 col-md-4 col-lg-3 mb-4"


      *ngFor="let p of resources2 | paginate : { itemsPerPage: 15, currentPage: Page }; let i = index"
    >
      <div
        class="card h-100 shadow-sm border rounded product-card position-relative"
        style="
          background-color: #fdfbfb;
          border-color: rgba(133, 132, 132, 0.2);
          border-width: 1.5px;
          border-style: solid;
        "
      >
        <!-- Icons -->
        <div
          class="position-absolute top-0 end-0 p-2 z-2 icon-container d-flex flex-column align-items-end"
          [ngClass]="{ 'd-none': !p.showIcons }"
          style="pointer-events: auto"
        >
          <div
            class="d-flex align-items-center justify-content-center rounded-circle mb-2"
            style="width: 36px; height: 36px; background-color: #dc3545; border: 1.5px solid #dc3545"
            *ngIf="p.wishlist == '1'"
            title="Remove from wishlist"
          >
            <i class="fa fa-heart text-danger cursor_pointer"></i>
          </div>

          <div
            class="d-flex align-items-center justify-content-center rounded-circle mb-2"
            style="width: 36px; height: 36px; background-color: #f1efeb; border: 1.5px solid #c0c4c7"
            *ngIf="p.wishlist != '1'"
            title="Add to wishlist"
          >
            <i class="fa fa-heart-o text-black cursor_pointer" style="background-color: white"></i>
          </div>

          <div
            class="d-flex align-items-center justify-content-center rounded-circle"
            style="width: 36px; height: 36px; background-color: #f1efeb; border: 1.5px solid #c0c4c7"
            (click)="sub_cat(p); $event.stopPropagation()"
            title="View details"
          >
            <i class="fa fa-eye text-black cursor_pointer"></i>
          </div>
        </div>

        <!-- Product Image -->
        <div (click)="sub_cat(p)" class="product-image text-center p-3" style="cursor: pointer">
          <img
            [src]="p.high_image_1"
            (error)="p.high_image_1 = 'https://gstbucket1.s3.ap-south-1.amazonaws.com/Powertexmodel/noimage.png'"
            class="img-fluid"
            style="height: 160px; object-fit: contain"
            alt="{{ p.subcategory }}"
          />
        </div>

        <!-- Product Body -->
        <div class="card-body p-3">
          <p class="text-muted mb-1 small brand">{{ p.subcategory }}</p>
          <p class="fw-medium mb-1 name text-truncate" title="{{ p.modelno }}">
            {{ p.modelno }}
          </p>

          <p class="fw-bold text-success mb-1 price">
            Rs.{{ p.discounted_price }}
            <del *ngIf="p.discount_percent > 0" class="text-muted small ms-2">Rs.{{ p.mrp }}</del>
          </p>

          <p *ngIf="p.discount_percent > 0" class="fw-medium mb-1" style="color: #009b77">
            {{ p.discount_percent }}% OFF
          </p>

          <p class="text-muted small mb-1">(Excluding GST)</p>

          <!-- ⭐ Rating -->
          <div class="rating text-warning small">
            <ng-container *ngFor="let star of [1, 2, 3, 4, 5]; let i = index">
              <span [ngClass]="i < p.rating ? 'fa fa-star' : 'fa fa-star-o'"></span>
            </ng-container>
          </div>
        </div>

        <!-- Cart Icon -->
        <button class="btn position-absolute cart-btn" style="bottom: 10px; right: 10px">
          <i class="fa fa-shopping-cart text-secondary"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Pagination -->
  <div style="text-align: center; padding: 20px">
    <pagination-controls (pageChange)="Page = $event"></pagination-controls>
  </div>
</div>


  </div>
</div>

<ngx-spinner class="loader_spinner"></ngx-spinner>
